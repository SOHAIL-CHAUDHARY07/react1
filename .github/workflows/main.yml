name: Build My Angular App

on:
  push:
    branches: [ main ]

jobs:
  Build-Angular-App:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      
      - name: Setup-nodejs
        uses: actions/setup-node@v6.2.0
        with:
          node-version: 22.x
      
      - name: Install Dependencies
        run: npm install
      
      - name: Build-Angular
        run: npm run build
